<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Wiki</title>

  <!-- settings live in config.js, style tweaks in user.css — both survive upgrades -->
  <script src="config.js"></script>

  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="vendor/highlight.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="user.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="btn" type="button" title="Menu" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    <a href="#" class="brand" data-home>&#128218; Local Wiki</a>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search pages…" autocomplete="off" spellcheck="false">
      <button id="clearSearch" class="clearbtn" type="button" title="Clear search">&times;</button>
    </div>
    <div class="modegrp">
      <div id="mode" class="mode" title="Where pages come from: bundled snapshot (data.js) or a connected live folder"></div>
      <button id="refresh" class="btn hidden" title="Re-read the connected folder now (live mode)">&#8635;</button>
      <button id="choose" class="btn hidden" title="Point the wiki at your markdown folder for live rendering (one-time, remembered).">Live render</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav id="tree" class="tree"></nav>
      <div id="tags" class="tags"></div>
    </aside>
    <div id="resizer" class="resizer" title="Drag to resize the sidebar"></div>
    <main id="content" class="content">
      <div class="main-col">
        <article id="page" class="page"></article>
        <section id="backlinks" class="backlinks"></section>
      </div>
      <nav id="tocRail" class="toc-rail hidden"></nav>
    </main>
  </div>
  <div id="searchResults" class="search-results hidden"></div>

  <!-- vendor (all local; downloaded once, never at runtime) -->
  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/mdit-extras.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib-auto-render.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
